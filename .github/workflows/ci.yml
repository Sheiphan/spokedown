name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      # The real Kokoro voice, cached between runs, so the integration tests run on every OS.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spokedown/models
          key: kokoro-model-v1
      - run: pnpm --filter @spokedown/engine fetch-model
      - run: pnpm -r test

  # Packages the extension for this OS exactly as the release does, installs it into a real
  # VS Code, and runs the end-to-end test (silent audio) against the packaged files.
  package-smoke:
    name: packaged extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spokedown/models
          key: kokoro-model-v1
      - run: pnpm --filter @spokedown/engine fetch-model
      - name: Package for this OS
        working-directory: extensions/vscode
        run: node scripts/package.mjs --native
      - name: End-to-end test on the packaged extension
        working-directory: extensions/vscode
        shell: bash
        run: |
          target="$(node -p "process.platform + '-' + process.arch")"
          code=0
          if [ "$RUNNER_OS" = Linux ]; then
            SPOKEDOWN_EXT_DIR="stage/$target" xvfb-run -a node test/e2e/run.mjs > e2e.log 2>&1 || code=$?
          else
            SPOKEDOWN_EXT_DIR="stage/$target" node test/e2e/run.mjs > e2e.log 2>&1 || code=$?
          fi
          cat e2e.log
          if [ "$code" != 0 ]; then
            # One annotation per line (a single multi-line one is truncated), so the cause shows on the run summary.
            echo "::error title=e2e failed on $RUNNER_OS ($target) exit $code::see the lines below"
            wc -l e2e.log | sed 's/^/::warning title=e2e log size::/'
            grep -nE '\[e2e\]|rror|ailed|Cannot|ENOENT|imeout|rash|xception' e2e.log | grep -v 'AgentHost' | head -n 8 | cut -c1-300 | while IFS= read -r line; do echo "::warning title=e2e log::$line"; done
            tail -n 8 e2e.log | cut -c1-300 | while IFS= read -r line; do echo "::notice title=e2e tail::$line"; done
            exit "$code"
          fi
