name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      # The real Kokoro voice, cached between runs, so the integration tests run on every OS.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spokedown/models
          key: kokoro-model-v1
      - run: pnpm --filter @spokedown/engine fetch-model
      - run: pnpm -r test

  # Packages the extension for this OS exactly as the release does, installs it into a real
  # VS Code, and runs the end-to-end test (silent audio) against the packaged files.
  package-smoke:
    name: packaged extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spokedown/models
          key: kokoro-model-v1
      - run: pnpm --filter @spokedown/engine fetch-model
      - name: Package for this OS
        working-directory: extensions/vscode
        run: node scripts/package.mjs --native
      - name: End-to-end test on the packaged extension
        working-directory: extensions/vscode
        shell: bash
        run: |
          target="$(node -p "process.platform + '-' + process.arch")"
          code=0
          if [ "$RUNNER_OS" = Linux ]; then
            SPOKEDOWN_EXT_DIR="stage/$target" xvfb-run -a node test/e2e/run.mjs > e2e.log 2>&1 || code=$?
          else
            SPOKEDOWN_EXT_DIR="stage/$target" node test/e2e/run.mjs > e2e.log 2>&1 || code=$?
          fi
          cat e2e.log
          if [ "$code" != 0 ]; then
            # Surface the useful lines as an annotation so they show on the run summary.
            summary="$(grep -E '\[e2e\]|rror|ailed|Cannot|ENOENT|timeout' e2e.log | tail -25 | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=e2e failed on $RUNNER_OS ($target)::$summary"
            exit "$code"
          fi
